version: '3.8'

services:
  family_netflix-auth-server:
    # 同時指定 image 與 build：
    # 1. 一般使用者直接執行 `docker compose up -d` 會從 GHCR 拉取現成映像檔 (無須本機編譯)
    # 2. 本地開發者執行 `docker compose up -d --build` 會使用本地 Dockerfile 重新編譯
    image: ghcr.io/po99al43/family_netflix_auth_web:latest
    build: .
    container_name: netflix_auth_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 掛載持久化資料目錄（儲存網頁初始化的密碼、credentials.json 與 token.json）
      - ./data:/app/data
    environment:
      - NODE_ENV=production


